# Camp Kernel - Non-GKI 4.19 SuSFS Configuration
# Place this file at: .github/susfs/susfs.conf

# Upstream fallback repo/branch when no local susfs_patch_to_4.19.patch is placed in .github/susfs/
SUSFS_REPO="JackA1ltman/NonGKI_Kernel_Build_2nd"
SUSFS_BRANCH="mainline"

# Relative paths inside SUSFS_REPO (or directly inside .github/susfs/ if placed locally)
SUSFS_PATCH_REL="Patches/Patch/susfs_patch_to_4.19.patch"
SUSFS_INLINE_SCRIPT_REL="Patches/susfs_inline_hook_patches.sh"

# SuSFS Kconfig feature toggles (y = enabled, n = disabled, auto = enable if supported by header)
SUSFS_INLINE_HOOK="y"
SUSFS_SUS_PATH="y"
SUSFS_SUS_MOUNT="y"
SUSFS_SUS_KSTAT="y"
SUSFS_SPOOF_UNAME="y"
SUSFS_ENABLE_LOG="y"
SUSFS_HIDE_KSU_SUSFS_SYMBOLS="y"
SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG="y"
SUSFS_OPEN_REDIRECT="y"
SUSFS_SUS_MAP="y"
SUSFS_PRIORITY_UID_FILTER="auto"
