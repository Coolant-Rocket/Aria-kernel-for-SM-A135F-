name: Build Aria Kernel (A135F)

# Aria - Samsung Galaxy A13 (SM-A135F, Exynos850), non-GKI 4.19.325
# KSU choices:
#   originsu    (default) ReSukiSU based, has SUSFS built in. Same integration as the reference build.
#   backslashxx backslashxx/KernelSU, hooks itself on 4.19, but has NO SUSFS support.
# SUSFS 2.3.0 (4.19 non-GKI backport, JackA1ltman/NonGKI_Kernel_Build_2nd) is vendored in this repo (.github/aria/susfs)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel tree (owner/name)'
        default: 'Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850'
      kernel_branch:
        description: 'Kernel tree branch/tag/commit'
        default: 'lineage-24.0'
      ksu:
        description: 'KernelSU variant'
        type: choice
        options: [originsu, backslashxx]
        default: originsu
      selinux:
        description: 'SELinux mode of the built kernel'
        type: choice
        options: [enforcing, permissive]
        default: enforcing
      susfs:
        description: 'Apply SUSFS 2.3.0 (originsu only)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      ksu_hook:
        description: 'backslashxx only: hook method'
        type: choice
        options: [branch_link, syscall_table]
        default: branch_link
      ksu_repo:
        description: 'Override KSU repository (owner/name), empty = variant default'
        default: ''
      ksu_ref:
        description: 'Override KSU branch/tag/commit, empty = variant default'
        default: ''
      defconfig:
        description: 'Kernel defconfig'
        default: 'exynos850-a13nsxx_defconfig'

permissions:
  contents: read

concurrency:
  group: build-aria-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  OUT: out
  KNAME: Aria
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-24.0' }}
  ARIA_CI: ${{ github.workspace }}/ci
  KSU: ${{ github.event.inputs.ksu || 'originsu' }}
  SELINUX: ${{ github.event.inputs.selinux || 'enforcing' }}
  SUSFS: ${{ github.event.inputs.susfs || 'true' }}
  KSU_HOOK: ${{ github.event.inputs.ksu_hook || 'branch_link' }}
  KSU_REPO_IN: ${{ github.event.inputs.ksu_repo }}
  KSU_REF_IN: ${{ github.event.inputs.ksu_ref }}
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}

jobs:
  build:
    name: Aria (${{ github.event.inputs.selinux || 'enforcing' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: kernel

    steps:
      - name: Checkout Aria CI files (this repo)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Clone kernel tree
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel || {
            # branch name failed (maybe a commit sha): full clone then checkout
            rm -rf kernel
            git clone "https://github.com/${KERNEL_REPO}.git" kernel
            git -C kernel checkout --force "${KERNEL_BRANCH}"
          }
          cd kernel
          test -f Makefile && head -4 Makefile
          grep -q 'PATCHLEVEL = 19' Makefile || { echo "::error::not a 4.19 tree"; exit 1; }
          {
            echo "### Kernel tree"
            echo "- \`${KERNEL_REPO}\` @ \`${KERNEL_BRANCH}\` ($(git rev-parse HEAD))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            lz4 zstd cpio rsync xz-utils zip unzip curl git ccache python3

      - name: Set up Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -fsSLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/neutron-clang/bin/clang" --version | head -1

      - name: Fetch KernelSU
        id: ksu
        run: |
          set -euo pipefail
          if [ "$KSU" = "originsu" ]; then R=samakshkambxj/OriginSU; B=main; else R=backslashxx/KernelSU; B=master; fi
          R="${KSU_REPO_IN:-$R}"; B="${KSU_REF_IN:-$B}"
          if [ "$KSU" = "backslashxx" ] && [ "$SUSFS" = "true" ]; then
            echo "::error::backslashxx/KernelSU has no SUSFS support. Use ksu=originsu or set susfs=false."
            exit 1
          fi
          echo "KSU_REPO=$R" >> "$GITHUB_ENV"; echo "KSU_REF=$B" >> "$GITHUB_ENV"
          rm -rf KernelSU
          git clone "https://github.com/${R}.git" KernelSU
          cd KernelSU
          git fetch --tags --force origin
          if git rev-parse --verify --quiet "origin/${B}" >/dev/null; then git checkout --force "origin/${B}"; else git checkout --force "${B}"; fi
          echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          { echo "### KernelSU"; echo "- \`${R}\` @ \`${B}\` ($(git rev-parse HEAD))"; echo "- variant: ${KSU}"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Integrate KernelSU into the tree
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          test -f "$D"
          if [ "$KSU" = "originsu" ]; then
            I=$ARIA_CI/.github/aria/originsu/kernel-integration.diff
            if [ "$SUSFS" = "true" ]; then
              # SUSFS uses the inline hooks, so only take the non-hook parts here
              git apply --verbose \
                --include='arch/arm64/configs/*' --include='drivers/Kconfig' --include='drivers/Makefile' \
                --include='security/selinux/selinuxfs.c' --include='security/selinux/ss/services.c' "$I"
            else
              git apply --verbose "$I"   # also installs the manual hook call sites
            fi
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          else
            ln -sfn ../KernelSU/kernel drivers/kernelsu
            grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            sed -i '/^CONFIG_KSU/d;/^# CONFIG_KSU/d' "$D"
            {
              echo ''; echo 'CONFIG_KSU=y'
              if [ "$KSU_HOOK" = "syscall_table" ]; then
                echo 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y'
              else
                echo 'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y'
              fi
            } >> "$D"
          fi
          ls -l drivers/kernelsu
          sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-${KNAME}\"/" "$D"
          grep -n 'CONFIG_KSU\|LOCALVERSION=' "$D"

      - name: SELinux mode (${{ github.event.inputs.selinux || 'enforcing' }})
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          # clear whatever the tree shipped with
          sed -i '/^CONFIG_SECURITY_SELINUX_ALWAYS_\(PERMISSIVE\|ENFORCE\)/d;/^# CONFIG_SECURITY_SELINUX_ALWAYS_\(PERMISSIVE\|ENFORCE\)/d' "$D"
          sed -i '/^CONFIG_CMDLINE=/d' "$D"
          if [ "$SELINUX" = "permissive" ]; then
            # The tree declares ALWAYS_PERMISSIVE but implements it nowhere, so add the code.
            git apply --verbose $ARIA_CI/.github/aria/selinux-always-permissive.diff
            {
              echo 'CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y'
              echo '# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set'
              echo 'CONFIG_CMDLINE="androidboot.selinux=permissive"'
            } >> "$D"
          else
            {
              echo '# CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE is not set'
              echo '# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set'
              echo 'CONFIG_CMDLINE=""'
            } >> "$D"
          fi
          grep -n 'SELINUX_ALWAYS\|^CONFIG_CMDLINE' "$D"

      - name: Apply SUSFS 2.3.0
        if: ${{ env.KSU == 'originsu' && env.SUSFS == 'true' }}
        run: |
          set -euo pipefail
          S=$ARIA_CI/.github/aria/susfs
          rm -f /tmp/susfs.rej
          patch -p1 -F3 --forward --no-backup-if-mismatch -r /tmp/susfs.rej < $S/susfs_patch_to_4.19.patch || \
            echo "::notice::SUSFS patch reported rejects, checking them"
          if [ -s /tmp/susfs.rej ]; then
            # Only the vfs_kern_mount hunk may reject: this tree has the fs_context mount API.
            grep -q 'vfs_kern_mount' /tmp/susfs.rej || { echo "::error::unexpected SUSFS rejects"; cat /tmp/susfs.rej; exit 1; }
          fi
          git apply $S/susfs-2.3.0-vfs-create-mount.diff
          git apply $S/susfs-2.3.0-no-show-options2.diff

          # SUSFS inline hooks (exec/open/stat/read/reboot/input/selinux)
          bash $S/susfs_inline_hook_patches.sh

          # adapt to OriginSU's signatures, and skip sucompat on kernel_execve() (NULL filename)
          sed -i 's/extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);/extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);/' fs/read_write.c
          sed -i 's/ksu_handle_sys_read(fd);/ksu_handle_sys_read(fd, \&buf, \&count);/' fs/read_write.c
          sed -i 's/if (likely(susfs_is_current_proc_no_su()))/if (!filename || likely(susfs_is_current_proc_no_su()))/' fs/exec.c

          # every hook OriginSU's inline check expects
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -q 'ksu_handle_setresuid' kernel/sys.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c

          D="arch/arm64/configs/${DEFCONFIG}"
          sed -i -e '/^CONFIG_KSU_MANUAL_HOOK=y$/d' -e '/^CONFIG_KSU_MANUAL_HOOK_AUTO_.*=y$/d' "$D"
          printf '\nCONFIG_KSU_SUSFS=y\n' >> "$D"
          grep -m1 'SUSFS_VERSION' include/linux/susfs.h

      - name: Configure kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH="$ARCH" O="$OUT" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- "$DEFCONFIG"
          grep -q '^CONFIG_KSU=y' "$OUT/.config"
          grep -q "^CONFIG_LOCALVERSION=\"-${KNAME}\"" "$OUT/.config"
          if [ "$KSU" = "originsu" ]; then
            if [ "$SUSFS" = "true" ]; then
              grep -q '^CONFIG_KSU_SUSFS=y' "$OUT/.config"; ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$OUT/.config"
            else
              grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$OUT/.config"
            fi
          elif [ "$KSU_HOOK" = "syscall_table" ]; then
            grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' "$OUT/.config"
          else
            grep -q '^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' "$OUT/.config"
          fi
          if [ "$SELINUX" = "permissive" ]; then
            grep -q '^CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y' "$OUT/.config"
          else
            ! grep -q '^CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y' "$OUT/.config"
          fi

      - name: Build kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH="$ARCH" O="$OUT" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=sizeof-pointer-memaccess"

      - name: Verify image
        run: |
          set -euo pipefail
          test -f "$OUT/arch/arm64/boot/Image"
          echo "kernel.release: $(cat "$OUT/include/config/kernel.release")"
          grep -q "${KNAME}" "$OUT/include/config/kernel.release"
          echo "ksu_* symbols: $(grep -c ' ksu_' "$OUT/System.map" || true)"

      - name: Package AnyKernel3
        id: pack
        run: |
          set -euo pipefail
          # AnyKernel3 package taken from A135F-Unbound (tools, anykernel.sh), only Image + dtb.img are ours
          rm -rf AK3 && cp -a "$ARIA_CI/anykernel" AK3
          cp "$OUT/arch/arm64/boot/Image" AK3/Image
          DTB="$(find "$OUT/arch/arm64/boot/dts" -name 'exynos3830.dtb' | head -n1)"
          test -n "$DTB" || { echo "::error::exynos3830.dtb was not built"; exit 1; }
          python3 "$ARIA_CI/.github/aria/mkdtbimg.py" "$DTB" AK3/dtb.img
          chmod +x AK3/tools/* AK3/META-INF/com/google/android/update-binary
          SUFFIX="${KSU}-${SELINUX}$([ "$KSU" = "originsu" ] && [ "$SUSFS" = "true" ] && echo -susfs)"
          ZIP="Aria-A135F-$(date -u +%Y%m%d)-${SUFFIX}-${{ steps.ksu.outputs.short }}.zip"
          (cd AK3 && zip -r9 "../$ZIP" . -x '*.git*')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: kernel/${{ steps.pack.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: aria-build-files-${{ env.SELINUX }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/System.map
            kernel/out/.config
          retention-days: 14
