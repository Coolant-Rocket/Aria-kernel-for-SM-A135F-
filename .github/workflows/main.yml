name: Build Aria Kernel (A13 Exynos850 + SukiSU-Ultra)

# Put this file in <your kernel repo>/.github/workflows/build-aria.yml
# Kernel: Samsung Galaxy A13 (A135F) exynos850, Linux 4.19.325, non-GKI
# Root:   SukiSU-Ultra `builtin` branch + CONFIG_KSU_HACK_ARM64_BRANCH_LINK (official 4.19+ ARM64 non-GKI path), KPM optional
# Clang:  newest Google AOSP prebuilt (platform/prebuilts/clang/host/linux-x86)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        default: "https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850"
      kernel_branch:
        description: "Kernel branch / tag"
        default: "lineage-24.0"
      defconfig:
        description: "Defconfig"
        default: "exynos850-a13nsxx_defconfig"
      sukisu_ref:
        description: "SukiSU-Ultra branch (official non-GKI branch is builtin)"
        default: "builtin"
      enable_kpm:
        description: "Enable SukiSU KPM (needs KALLSYMS_ALL)"
        type: boolean
        default: true
      clang_version:
        description: "Pin a Google clang dir (e.g. clang-r547379). Empty = latest"
        default: ""
      include_dtb:
        description: "Also put exynos3830.dtb inside the zip (leave off unless your boot.img needs it)"
        type: boolean
        default: false
      publish_release:
        description: "Publish the zip as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  KERNEL_NAME: Aria
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Clone kernel source from link
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850' }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'lineage-24.0' }}
          # Optional: only for private repos. Add a secret named KERNEL_REPO_TOKEN (PAT with repo read access).
          KERNEL_REPO_TOKEN: ${{ secrets.KERNEL_REPO_TOKEN }}
        run: |
          set -eo pipefail
          URL="$KERNEL_REPO"
          if [ -n "$KERNEL_REPO_TOKEN" ]; then
            URL="${URL/https:\/\//https://x-access-token:${KERNEL_REPO_TOKEN}@}"
          fi
          # The workspace is empty (no actions/checkout), so clone straight into it.
          git clone --depth=1 -b "$KERNEL_BRANCH" "$URL" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # Don't keep the token in .git/config
          git remote set-url origin "$KERNEL_REPO"
          git log -1 --oneline
          test -f Makefile && grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            lz4 cpio zip unzip xz-utils curl git make \
            device-tree-compiler python3 python-is-python3 \
            build-essential

      - name: Fetch latest Google Clang prebuilt
        env:
          CLANG_PIN: ${{ inputs.clang_version }}
        run: |
          set -eo pipefail
          git clone --depth=1 --filter=blob:none --sparse -b main \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$HOME/clang-repo"
          cd "$HOME/clang-repo"
          if [ -n "$CLANG_PIN" ]; then
            CLANG_DIR="$CLANG_PIN"
          else
            CLANG_DIR=$(git ls-tree --name-only HEAD | grep -E '^clang-r[0-9]+[a-z]?$' | sort -V | tail -n1)
          fi
          [ -n "$CLANG_DIR" ] || { echo "Could not resolve a clang directory"; exit 1; }
          echo "Using Google clang: $CLANG_DIR"
          git sparse-checkout set "$CLANG_DIR"
          echo "$HOME/clang-repo/$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Show toolchain and enforce SukiSU minimum
        run: |
          set -eo pipefail
          clang --version
          ld.lld --version
          llvm-objcopy --version | head -n1
          # SukiSU-Ultra builtin (kernel/INTERNAL.md): constexpr is broken on clang < 19 and
          # function-pointer static init fails on some clang 17~20 forks. Google's newest
          # prebuilt is the recommended path; refuse anything older than clang 19.
          MAJOR=$(clang -dumpversion | cut -d. -f1)
          echo "clang major: $MAJOR (from ${CLANG_DIR})"
          if [ "$MAJOR" -lt 19 ]; then
            echo "clang $MAJOR is too old for SukiSU-Ultra (need >= 19)."
            echo "Leave the clang_version input empty to use the newest Google prebuilt."
            exit 1
          fi

      - name: Integrate SukiSU-Ultra (official non-GKI `builtin` branch)
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref || 'builtin' }}
        run: |
          set -eo pipefail
          # Official command from https://sukisu.org/guide/how-to-integrate (builtin branch):
          #   curl -LSs ".../SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          # It clones SukiSU-Ultra into ./KernelSU, symlinks drivers/kernelsu and patches
          # drivers/Makefile + drivers/Kconfig.
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "${SUKISU_REF}"

          # The page's 4.19+ ARM64 recommendation (CONFIG_KSU_HACK_ARM64_BRANCH_LINK) needs the newer
          # builtin Kconfig. If this ref is the older layout, fall back to `builtin-new`.
          if ! grep -q "KSU_HACK_ARM64_BRANCH_LINK" KernelSU/kernel/Kconfig; then
            echo "Ref '${SUKISU_REF}' has no KSU_HACK_ARM64_BRANCH_LINK -> using builtin-new"
            (cd KernelSU && git fetch origin builtin-new && git checkout -f FETCH_HEAD)
          fi
          grep -q "KSU_HACK_ARM64_BRANCH_LINK" KernelSU/kernel/Kconfig \
            || { echo "No BRANCH_LINK support in SukiSU Kconfig"; exit 1; }

          test -L drivers/kernelsu || { echo "drivers/kernelsu symlink missing"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "drivers/Makefile not patched"; exit 1; }
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || { echo "drivers/Kconfig not patched"; exit 1; }

          cd KernelSU
          echo "SUKISU_COMMIT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Backport path_umount (missing in 4.19)
        run: |
          set -eo pipefail
          # SukiSU's kernel-umount feature uses path_umount() (Linux 5.9+). The builtin branch only
          # skips it at runtime when absent, so provide it to keep the feature working. Idempotent.
          cat > "$HOME/patch_umount.py" <<'PY'
          import sys
          p = sys.argv[1] if len(sys.argv) > 1 else "fs/namespace.c"
          s = open(p).read()
          if "ARIA_BACKPORT_PATH_UMOUNT" in s:
              print("already patched"); sys.exit(0)
          pu = '''/* ARIA_BACKPORT_PATH_UMOUNT: path_umount() from 5.9, used by SukiSU kernel umount */
          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;

          	ret = do_umount(mnt, flags);

          	/* we mustn't call path_put() as that would clear mnt_expiry_mark */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          '''
          m = "SYSCALL_DEFINE2(umount, char __user *, name, int, flags)"
          assert s.count(m) == 1
          s = s.replace(m, pu + m, 1)
          open(p, "w").write(s)
          print("patched", p)
          PY
          python3 "$HOME/patch_umount.py" fs/namespace.c

      - name: Configure kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}
          ENABLE_KPM: ${{ inputs.enable_kpm }}
        run: |
          set -eo pipefail
          cat > "$HOME/mk.sh" <<'MK'
          #!/bin/bash
          exec make -j"$(nproc)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            KBUILD_BUILD_USER=Aria KBUILD_BUILD_HOST=github-actions \
            "$@"
          MK
          chmod +x "$HOME/mk.sh"

          "$HOME/mk.sh" "$DEFCONFIG"

          C="scripts/config --file out/.config"
          # Kernel name -> uname -r = 4.19.325-Aria
          $C --set-str LOCALVERSION "-${KERNEL_NAME}"
          $C -d LOCALVERSION_AUTO
          # SukiSU-Ultra builtin branch, non-GKI 4.19 ARM64 (official page):
          # no kprobes, no kernel source hooks -> CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          $C -e MODULES -e KALLSYMS -e EXT4_FS -e OVERLAY_FS
          $C -e SECURITY_SELINUX -e SECCOMP -e SECCOMP_FILTER
          # SELinux: enforcing by default (Android init sets it) and switchable at runtime
          # via `setenforce 0|1`. Needs DEVELOP on and both ALWAYS_* locks off.
          $C -e SECURITY_SELINUX_DEVELOP
          $C -d SECURITY_SELINUX_ALWAYS_PERMISSIVE -d SECURITY_SELINUX_ALWAYS_ENFORCE
          $C -d SECURITY_SELINUX_DISABLE -d ALWAYS_ENFORCE
          $C -e KSU
          $C -d KSU_TAMPER_SYSCALL_TABLE -d KSU_KPROBES_KSUD
          $C -e KSU_HACK_ARM64_BRANCH_LINK
          $C -d KSU_DEBUG
          if [ "$ENABLE_KPM" = "true" ]; then
            $C -e KALLSYMS_ALL -e KPM
          else
            $C -d KPM
          fi

          "$HOME/mk.sh" olddefconfig

          echo "---- verifying .config ----"
          for o in CONFIG_KSU=y CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y CONFIG_KALLSYMS=y CONFIG_EXT4_FS=y "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\""; do
            grep -qx "$o" out/.config && echo "OK   $o" || { echo "MISSING $o"; exit 1; }
          done
          if [ "$ENABLE_KPM" = "true" ]; then
            grep -qx "CONFIG_KPM=y" out/.config && echo "OK   CONFIG_KPM=y" || { echo "MISSING CONFIG_KPM=y"; exit 1; }
          fi
          grep -qx "CONFIG_SECURITY_SELINUX_DEVELOP=y" out/.config || { echo "SELINUX_DEVELOP missing"; exit 1; }
          if grep -qE "^CONFIG_(SECURITY_SELINUX_ALWAYS_PERMISSIVE|SECURITY_SELINUX_ALWAYS_ENFORCE|ALWAYS_ENFORCE)=y" out/.config; then
            echo "SELinux is locked to one mode"; exit 1
          fi
          echo "OK   SELinux switchable"

      - name: Build Image + DTBs
        run: |
          set -eo pipefail
          "$HOME/mk.sh" Image dtbs 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Package flashable zip (AnyKernel3)
        env:
          INCLUDE_DTB: ${{ inputs.include_dtb }}
        run: |
          set -eo pipefail
          KVER=$(make -s O=out ARCH=arm64 kernelversion)
          DATE=$(date -u +%Y%m%d-%H%M)
          ZIP="${KERNEL_NAME}-A135F-${KVER}-SukiSU-${SUKISU_COMMIT}-${DATE}.zip"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          mkdir -p ak3/modules ak3/patch ak3/ramdisk
          cp out/arch/arm64/boot/Image ak3/Image
          if [ "$INCLUDE_DTB" = "true" ]; then
            cp out/arch/arm64/boot/dts/exynos/exynos3830.dtb ak3/dtb
          fi

          cat > ak3/anykernel.sh <<'AK'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Aria Kernel | Galaxy A13 (A135F) | 4.19 | SukiSU-Ultra
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13
          device.name2=a13nsxx
          device.name3=a135f
          device.name4=SM-A135F
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # boot shell variables
          block=boot
          is_slot_device=0
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_block_display=1

          . tools/ak3-core.sh

          dump_boot
          write_boot
          AK

          (cd ak3 && zip -r9 "../$ZIP" . -x '*.git*')
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          mkdir -p dist
          mv "$ZIP" "$ZIP.sha256" dist/
          cp out/arch/arm64/boot/Image dist/Image
          cp out/.config dist/aria.config
          cp build.log dist/build.log
          mkdir -p dist/dtbs
          find out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' | xargs -r -I{} cp {} dist/dtbs/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria-${{ github.run_number }}
          name: Aria ${{ github.run_number }} (SukiSU ${{ env.SUKISU_COMMIT }})
          body: |
            Aria kernel for Galaxy A13 (A135F), Linux 4.19.325 + SukiSU-Ultra (${{ env.SUKISU_COMMIT }})
            Clang: ${{ env.CLANG_DIR }} (Google prebuilt)
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.ZIP_NAME }}.sha256
