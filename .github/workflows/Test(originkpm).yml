name: Build Aria Kernel TEST CIP+Origin+KPM (A135F)

# Aria - Samsung Galaxy A13 (SM-A135F, Exynos850), non-GKI 4.19.325 + Optional CIP (-st / -st-rc / -cip) Merge
# Kernel tree: cloned from GitHub (inputs below)
# KernelSU:    originsu (samakshkambxj/OriginSU + SuSFS 2.3.0 inline-hook / manual-hook + native KPM + Veil + Multi-Manager + optional NoMount)
#              OR backslashxx (backslashxx/KernelSU, official kernel/setup.sh)
# Output:      the kernel Image and dtb.img

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel tree (owner/name)'
        default: 'Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850'
      kernel_branch:
        description: 'Kernel tree branch/tag/commit'
        default: 'lineage-24.0'
      cip_merge:
        description: 'Merge Linux 4.19 CIP / ST upstream branch before building (none = stock tree)'
        type: choice
        options:
          - linux-4.19.y-st-rc
          - linux-4.19.y-st
          - linux-4.19.y-cip
          - none
        default: 'linux-4.19.y-st-rc'
      strip_cip_localversion:
        description: 'Remove localversion-st / localversion-cip after CIP merge (Rissu A12s style)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      ksu_variant:
        description: 'KernelSU implementation: originsu (OriginSU + Veil + Multi-Manager) | backslashxx'
        type: choice
        options: [originsu, backslashxx]
        default: originsu
      susfs:
        description: 'OriginSU only: Apply SuSFS 2.3.0 (4.19 non-GKI inline-hook backport; false = manual hook)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      kpm:
        description: 'OriginSU only: Enable OriginSU native KPM support (CONFIG_KPM=y)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      nomount:
        description: 'OriginSU only: Integrate vendored NoMount v2.2.0 VFS driver (CONFIG_NOMOUNT=y)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      selinux:
        description: 'SELinux mode of the built kernel'
        type: choice
        options: [enforcing, permissive]
        default: enforcing
      ksu_hook:
        description: 'backslashxx only: KernelSU hook method (branch_link recommended on 4.19)'
        type: choice
        options: [branch_link, syscall_table]
        default: branch_link
      cpu_governor:
        description: 'Default CPU governor (all governors are built in, switch any time at runtime)'
        type: choice
        options: [schedutil, ondemand, energystep, conservative, performance, powersave, userspace]
        default: schedutil
      physwizz_config:
        description: 'physwizz defconfig changes (LZ4, kprobes off, stackprotector-strong off, no auto localversion)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      freq_method:
        description: 'Range method: minimal (a12s lineage: boot parameters + GPU rows, safest) | full (pkenti: also patches the firmware tables)'
        type: choice
        options: [minimal, full]
        default: minimal
      cpu_freq_mode:
        description: 'CPU range: stock | uc 130-2002 MHz | oc 130-2210 MHz (minimal) or 130-2314 MHz (full)'
        type: choice
        options: [stock, uc, oc]
        default: stock
      cpu_undervolt_uv:
        description: 'CPU undervolt in microvolts, both clusters (0 = off, e.g. 25000), kernel built-in margin method'
        default: '0'
      gpu_freq_mode:
        description: 'GPU range: stock | oc up to 1196 MHz (full also lowers the minimum to 100 MHz)'
        type: choice
        options: [stock, oc]
        default: stock
      gpu_undervolt_uv:
        description: 'GPU undervolt in microvolts (0 = off, e.g. 25000)'
        default: '0'
      cpu_idle_teo:
        description: 'CPU idle: TEO governor (pkenti)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      pkenti_config:
        description: 'pkenti defconfig changes (BBR, fq_codel, HZ 300, debug off, ...)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      release:
        description: 'Publish Image and dtb.img as plain files in a GitHub Release'
        type: choice
        options: ['true', 'false']
        default: 'true'
      ksu_repo:
        description: 'KernelSU repository override (empty = auto: samakshkambxj/OriginSU or backslashxx/KernelSU)'
        default: ''
      ksu_ref:
        description: 'KernelSU branch, tag, or commit (empty = auto: main for OriginSU, latest default branch for backslashxx)'
        default: ''
      defconfig:
        description: 'Kernel defconfig'
        default: 'exynos850-a13nsxx_defconfig'

permissions:
  contents: write

concurrency:
  group: build-aria-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  OUT: out
  KNAME: Aria
  ARIA_CI: ${{ github.workspace }}/ci
  CIP_GIT_URL: https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-24.0' }}
  CIP_MERGE: ${{ github.event.inputs.cip_merge || 'linux-4.19.y-st-rc' }}
  STRIP_CIP_LOCALVERSION: ${{ github.event.inputs.strip_cip_localversion || 'true' }}
  KSU_VARIANT: ${{ github.event.inputs.ksu_variant || 'originsu' }}
  SUSFS: ${{ github.event.inputs.susfs || 'true' }}
  KPM: ${{ github.event.inputs.kpm || 'true' }}
  NOMOUNT: ${{ github.event.inputs.nomount || 'false' }}
  SELINUX: ${{ github.event.inputs.selinux || 'enforcing' }}
  KSU_HOOK: ${{ github.event.inputs.ksu_hook || 'branch_link' }}
  CPU_GOVERNOR: ${{ github.event.inputs.cpu_governor || 'schedutil' }}
  PHYSWIZZ_CONFIG: ${{ github.event.inputs.physwizz_config || 'true' }}
  RELEASE: ${{ github.event.inputs.release || 'true' }}
  FREQ_METHOD: ${{ github.event.inputs.freq_method || 'minimal' }}
  CPU_FREQ_MODE: ${{ github.event.inputs.cpu_freq_mode || 'stock' }}
  CPU_UV: ${{ github.event.inputs.cpu_undervolt_uv || '0' }}
  GPU_UV: ${{ github.event.inputs.gpu_undervolt_uv || '0' }}
  GPU_FREQ_MODE: ${{ github.event.inputs.gpu_freq_mode || 'stock' }}
  CPU_IDLE_TEO: ${{ github.event.inputs.cpu_idle_teo || 'true' }}
  PKENTI_CONFIG: ${{ github.event.inputs.pkenti_config || 'true' }}
  KSU_REPO: ${{ github.event.inputs.ksu_repo }}
  KSU_REF: ${{ github.event.inputs.ksu_ref }}
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}

jobs:
  build:
    name: Aria (${{ github.event.inputs.ksu_variant || 'originsu' }}, susfs=${{ github.event.inputs.susfs || 'true' }}, kpm=${{ github.event.inputs.kpm || 'true' }}, cip=${{ github.event.inputs.cip_merge || 'linux-4.19.y-st-rc' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: kernel

    steps:
      - name: Checkout Aria CI files (this repo)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Clone kernel tree
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "$CIP_MERGE" != "none" ]; then
            git clone --single-branch --branch "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel || {
              rm -rf kernel
              git clone "https://github.com/${KERNEL_REPO}.git" kernel
              git -C kernel checkout --force "${KERNEL_BRANCH}"
            }
          else
            git clone --depth=1 --branch "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel || {
              rm -rf kernel
              git clone "https://github.com/${KERNEL_REPO}.git" kernel
              git -C kernel checkout --force "${KERNEL_BRANCH}"
            }
          fi
          cd kernel
          git config user.name "Aria CI"
          git config user.email "actions@github.com"
          grep -q '^PATCHLEVEL = 19' Makefile || { echo "::error::not a 4.19 tree"; exit 1; }
          { echo "### Kernel tree"; echo "- \`${KERNEL_REPO}\` @ \`${KERNEL_BRANCH}\` ($(git rev-parse HEAD))"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge CIP branch (${{ github.event.inputs.cip_merge || 'linux-4.19.y-st-rc' }}) with Smart Exynos850 Resolution
        if: ${{ env.CIP_MERGE != 'none' }}
        run: |
          set -euo pipefail
          ORIG_HEAD="$(git rev-parse HEAD)"
          git remote add cip "$CIP_GIT_URL"
          git fetch --no-tags cip "+refs/heads/${CIP_MERGE}:refs/remotes/cip/${CIP_MERGE}"
          CIP_SHA="$(git rev-parse --short=12 "cip/${CIP_MERGE}")"
          CIP_LV="$(git show "cip/${CIP_MERGE}:localversion-st" 2>/dev/null || echo 'none')"

          MERGE_EXIT=0
          git merge --no-commit --no-ff "cip/${CIP_MERGE}" || MERGE_EXIT=$?
          if [ "$MERGE_EXIT" -ge 128 ]; then
            echo "::error::Fatal git merge error ($MERGE_EXIT)"
            exit "$MERGE_EXIT"
          fi

          if [ "$MERGE_EXIT" -ne 0 ]; then
            # 0. For include/net/sock.h, keep BOTH sides of its single struct sock conflict hunk so CIP's
            #    clean-merged static inlines (sk_owner_clear, sk_owner_put, sk_nulls_replace_node_init_rcu, sock_rmem_free)
            #    and Android's KABI reserves are all preserved
            if [ -f include/net/sock.h ] && grep -q '^<<<<<<< ' include/net/sock.h; then
              sed -i '/^<<<<<<< /d; /^=======$/d; /^>>>>>>> /d' include/net/sock.h
              git add include/net/sock.h
            fi

            # 1. Resolve remaining modify/delete (deleted non-Samsung DTS/tg3) and content conflicts (Exynos850/OneUI/5.10 backports)
            git diff --name-only --diff-filter=U > /tmp/cip-conflicted-files.txt
            while IFS= read -r cfile; do
              [ -n "$cfile" ] || continue
              if ! git cat-file -e "HEAD:${cfile}" 2>/dev/null; then
                git rm -f "$cfile"
              else
                git checkout --ours -- "$cfile"
                git add "$cfile"
              fi
            done < /tmp/cip-conflicted-files.txt

            # 2. Additive fixes required by clean-merged CIP files:
            #    (a) fs/Makefile: CIP commit bd82c675967d ("fs: common implementation of file type") adds fs_types.o
            if [ -f fs/fs_types.c ] && ! grep -q 'fs_types\.o' fs/Makefile; then
              sed -i 's/fs_context\.o fs_parser\.o/fs_context.o fs_parser.o fs_types.o/' fs/Makefile
              git add fs/Makefile
            fi

            #    (b) include/linux/fs.h: CIP commit bd82c675967d adds #include <linux/fs_types.h>
            if [ -f include/linux/fs_types.h ] && ! grep -q '<linux/fs_types\.h>' include/linux/fs.h; then
              sed -i '/#include <linux\/android_kabi\.h>/a #include <linux/fs_types.h>' include/linux/fs.h
              git add include/linux/fs.h
            fi

            #    (c) include/net/addrconf.h & net/ipv6/addrconf.c:
            #        - CIP commit d289479f070a adds in6_dev_hold_safe() used by net/ipv6/mcast.c
            #        - CIP commit babbfae4dda8 makes __ipv6_get_lladdr() static in net/ipv6/addrconf.c
            if ! grep -q 'in6_dev_hold_safe' include/net/addrconf.h; then
              sed -i '/void inet6_ifa_finish_destroy(struct inet6_ifaddr \*ifp);/i static inline bool in6_dev_hold_safe(struct inet6_dev *idev)\n{\n\treturn refcount_inc_not_zero(\&idev->refcnt);\n}\n' include/net/addrconf.h
            fi
            sed -i '/int __ipv6_get_lladdr(struct inet6_dev \*idev, struct in6_addr \*addr,/,/u32 banned_flags);/d' include/net/addrconf.h
            git add include/net/addrconf.h

            #    (d) net/ipv4/inet_connection_sock.c:
            #        - CIP commit f9544eee41e7 ("tcp/dccp: Don't use timer_pending() in reqsk_queue_unlink().")
            #          calls 6.x helper timer_delete_sync(), which in Linux 4.19 is del_timer_sync()
            if [ -f net/ipv4/inet_connection_sock.c ] && grep -q 'timer_delete_sync' net/ipv4/inet_connection_sock.c; then
              sed -i 's/\btimer_delete_sync\b/del_timer_sync/g' net/ipv4/inet_connection_sock.c
              git add net/ipv4/inet_connection_sock.c
            fi

            #    (e) drivers/md/dm-verity-debug.c:
            #        - CIP commit 0c8cbac25b40 ("dm-verity: make error counter atomic") changed v->corrupted_errs
            #          from unsigned int to atomic_t in dm-verity.h, breaking Samsung's out-of-tree dm-verity-debug.c
            if [ -f drivers/md/dm-verity-debug.c ] && grep -q 'atomic_t corrupted_errs' drivers/md/dm-verity.h; then
              sed -i 's/v->corrupted_errs++/atomic_inc(\&v->corrupted_errs)/g; s/v->corrupted_errs >=/atomic_read(\&v->corrupted_errs) >=/g; s/v->corrupted_errs ==/atomic_read(\&v->corrupted_errs) ==/g' drivers/md/dm-verity-debug.c
              git add drivers/md/dm-verity-debug.c
            fi

            #    (f) Prevent FT_MAX macro collision (defined as 8 in include/linux/fs_types.h)
            #        with enum FT_MAX in drivers/soc/samsung/exynos_cpu_perf/exynos_perf_ncmemcpy.c
            while IFS= read -r ftf; do
              [ -n "$ftf" ] || continue
              sed -i 's/\bFT_MAX\b/DRV_FT_MAX/g' "$ftf"
              git add "$ftf"
            done < <(grep -rl '\bFT_MAX\b' drivers/ sound/ arch/arm64/ 2>/dev/null || true)

            # 3. Keep Samsung OneUI fs/ext4, fs/f2fs, drivers/usb (+ usb/{hcd,gadget}.h), and drivers/mmc coherent
            #    (include/linux/usb.h stays on CIP's variadic usb_maxpacket macro so both 2-arg and 3-arg callers compile)
            git checkout "$ORIG_HEAD" -- fs/ext4 fs/f2fs drivers/usb include/linux/usb/hcd.h include/linux/usb/gadget.h drivers/mmc include/linux/mmc
            git add fs/ext4 fs/f2fs drivers/usb include/linux/usb/hcd.h include/linux/usb/gadget.h drivers/mmc include/linux/mmc
          fi

          if [ "$STRIP_CIP_LOCALVERSION" = "true" ]; then
            rm -f localversion-st localversion-cip .gitlab-ci.yml
            git rm --ignore-unmatch -f localversion-st localversion-cip .gitlab-ci.yml >/dev/null 2>&1 || true
          fi

          git commit -m "Merge cip/${CIP_MERGE} (${CIP_SHA}, ${CIP_LV}) into ${KERNEL_BRANCH}"
          {
            echo "### CIP Merge"
            echo "- Merged \`cip/${CIP_MERGE}\` @ \`${CIP_SHA}\` (\`localversion-st: ${CIP_LV}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            lz4 zstd cpio rsync xz-utils zip unzip curl git python3

      - name: Set up Neutron Clang
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -fsSLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/neutron-clang/bin/clang" --version | head -1

      - name: Add KernelSU (backslashxx official setup.sh)
        if: ${{ env.KSU_VARIANT == 'backslashxx' }}
        id: ksu_backslashxx
        run: |
          set -euo pipefail
          REPO="${KSU_REPO}"
          if [ -z "$REPO" ] || [ "$REPO" = "samakshkambxj/OriginSU" ]; then
            REPO="backslashxx/KernelSU"
          fi
          rm -rf KernelSU
          git clone "https://github.com/${REPO}.git" KernelSU
          REF="${KSU_REF:-$(git -C KernelSU symbolic-ref --short HEAD)}"
          bash KernelSU/kernel/setup.sh "$REF"

          test -L drivers/kernelsu && test -f drivers/kernelsu/Kconfig
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          SHORT="$(git -C KernelSU rev-parse --short=10 HEAD)"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}"   >> "$GITHUB_OUTPUT"
          {
            echo "### KernelSU (backslashxx)"
            echo "- \`${REPO}\` @ \`${REF}\` ($(git -C KernelSU rev-parse HEAD))"
            echo "- hook method: \`${KSU_HOOK}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch OriginSU and apply kernel integration
        if: ${{ env.KSU_VARIANT == 'originsu' }}
        id: originsu
        run: |
          set -euo pipefail
          REPO="${KSU_REPO}"
          if [ -z "$REPO" ] || [ "$REPO" = "backslashxx/KernelSU" ]; then
            REPO="samakshkambxj/OriginSU"
          fi
          REF="${KSU_REF:-main}"

          rm -rf KernelSU
          git clone "https://github.com/${REPO}.git" KernelSU
          cd KernelSU
          git fetch --tags --force origin

          # Prefer remote-tracking branch, fall back to tag/commit.
          if git rev-parse --verify --quiet "origin/${REF}" >/dev/null; then
            git checkout --force "origin/${REF}"
          else
            git checkout --force "${REF}"
          fi
          git submodule update --init --recursive || true

          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=12 HEAD)"
          SUBJECT="$(git log -1 --format='%s')"
          echo "sha=${SHA}"     >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}"   >> "$GITHUB_OUTPUT"
          echo "ref=${REF}"     >> "$GITHUB_OUTPUT"
          cd ..

          # Locate kernel-integration.diff in CI repo or generate it inline
          INTEGRATION_DIFF=""
          for candidate in \
            "$ARIA_CI/.github/originsu/kernel-integration.diff" \
            "$ARIA_CI/.github/aria/kernel-integration.diff" \
            "$ARIA_CI/kernel-integration.diff" \
            ".github/originsu/kernel-integration.diff"; do
            if [ -f "$candidate" ]; then
              INTEGRATION_DIFF="$candidate"
              break
            fi
          done

          if [ -z "$INTEGRATION_DIFF" ]; then
            INTEGRATION_DIFF="/tmp/kernel-integration.diff"
            cat > "$INTEGRATION_DIFF" <<'EOF'
          diff --git a/drivers/Kconfig b/drivers/Kconfig
          --- a/drivers/Kconfig
          +++ b/drivers/Kconfig
          @@ -264,4 +264,5 @@ source "drivers/sensorhub/sensor/Kconfig" # ADDED BY LEGO AUTOMATICALLY: DO NOT
           source "drivers/sensorhub/sensorhub/Kconfig" # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
           source "drivers/sensorhub/vendor/Kconfig" # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
           source "drivers/sensors_lego/Kconfig" # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
          +source "drivers/kernelsu/Kconfig"
           endmenu
          diff --git a/drivers/Makefile b/drivers/Makefile
          --- a/drivers/Makefile
          +++ b/drivers/Makefile
          @@ -228,3 +228,5 @@ obj-y += vibrator/dc/ # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
           obj-y += battery/common/ # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
           obj-y += sensorhub/ # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
           obj-y += sensors_lego/ # ADDED BY LEGO AUTOMATICALLY: DO NOT SUBMIT
          +
          +obj-$(CONFIG_KSU) += kernelsu/
          diff --git a/fs/exec.c b/fs/exec.c
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1912,12 +1912,33 @@ static int __do_execve_file(int fd, struct filename *filename,
           	return retval;
           }
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +__attribute__((hot))
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          +				void *argv, void *envp, int *flags);
          +__attribute__((hot))
          +extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,
          +				void *argv, void *envp, int *flags, int *retval);
          +#endif
          +
           static int do_execveat_common(int fd, struct filename *filename,
           			      struct user_arg_ptr argv,
           			      struct user_arg_ptr envp,
           			      int flags)
           {
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	int retval;
          +
          +	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +
          +	retval = __do_execve_file(fd, filename, argv, envp, flags, NULL);
          +
          +	ksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);
          +
          +	return retval;
          +#else
           	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          +#endif
           }
           
           int do_execve_file(struct file *file, void *__argv, void *__envp)
          diff --git a/fs/open.c b/fs/open.c
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -444,8 +444,17 @@ long do_faccessat(int dfd, const char __user *filename, int mode)
           	return res;
           }
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +__attribute__((hot))
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          +				int *mode, int *flags);
          +#endif
          +
           SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
           {
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          +#endif
           	return do_faccessat(dfd, filename, mode);
           }
           
          diff --git a/fs/stat.c b/fs/stat.c
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -353,6 +353,17 @@ SYSCALL_DEFINE2(newlstat, const char __user *, filename,
           	return cp_new_stat(&stat, statbuf);
           }
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +__attribute__((hot))
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
          +				int *flags);
          +
          +extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          +#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          +extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          +#endif
          +#endif
          +
           #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
           SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           		struct stat __user *, statbuf, int, flag)
          @@ -360,6 +371,9 @@ SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           	struct kstat stat;
           	int error;
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_stat(&dfd, &filename, &flag);
          +#endif
           	error = vfs_fstatat(dfd, filename, &stat, flag);
           	if (error)
           		return error;
          @@ -375,6 +389,9 @@ SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
           	if (!error)
           		error = cp_new_stat(&stat, statbuf);
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_newfstat_ret(&fd, &statbuf);
          +#endif
           	return error;
           }
           
          @@ -501,6 +518,9 @@ SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)
           	if (!error)
           		error = cp_new_stat64(&stat, statbuf);
           
