name: Build Aria Kernel (A135F)

# Aria - Samsung Galaxy A13 (SM-A135F, Exynos850), non-GKI 4.19.325 + Optional CIP (-st / -st-rc / -cip) Merge
# Kernel tree: cloned from GitHub (inputs below)
# KernelSU:    backslashxx/KernelSU, set up with its official kernel/setup.sh (no SUSFS: backslashxx has none)
# Output:      the kernel Image and dtb.img

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel tree (owner/name)'
        default: 'Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850'
      kernel_branch:
        description: 'Kernel tree branch/tag/commit'
        default: 'lineage-24.0'
      cip_merge:
        description: 'Merge Linux 4.19 CIP / ST upstream branch before building (none = stock tree)'
        type: choice
        options:
          - linux-4.19.y-st-rc
          - linux-4.19.y-st
          - linux-4.19.y-cip
          - none
        default: 'linux-4.19.y-st-rc'
      strip_cip_localversion:
        description: 'Remove localversion-st / localversion-cip after CIP merge (Rissu A12s style)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      selinux:
        description: 'SELinux mode of the built kernel'
        type: choice
        options: [enforcing, permissive]
        default: enforcing
      ksu_hook:
        description: 'KernelSU hook method (branch_link recommended on 4.19)'
        type: choice
        options: [branch_link, syscall_table]
        default: branch_link
      cpu_governor:
        description: 'Default CPU governor (all governors are built in, switch any time at runtime)'
        type: choice
        options: [schedutil, ondemand, energystep, conservative, performance, powersave, userspace]
        default: schedutil
      physwizz_config:
        description: 'physwizz defconfig changes (LZ4, kprobes off, stackprotector-strong off, no auto localversion)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      freq_method:
        description: 'Range method: minimal (a12s lineage: boot parameters + GPU rows, safest) | full (pkenti: also patches the firmware tables)'
        type: choice
        options: [minimal, full]
        default: minimal
      cpu_freq_mode:
        description: 'CPU range: stock | uc 130-2002 MHz | oc 130-2210 MHz (minimal) or 130-2314 MHz (full)'
        type: choice
        options: [stock, uc, oc]
        default: stock
      cpu_undervolt_uv:
        description: 'CPU undervolt in microvolts, both clusters (0 = off, e.g. 25000), kernel built-in margin method'
        default: '0'
      gpu_freq_mode:
        description: 'GPU range: stock | oc up to 1196 MHz (full also lowers the minimum to 100 MHz)'
        type: choice
        options: [stock, oc]
        default: stock
      gpu_undervolt_uv:
        description: 'GPU undervolt in microvolts (0 = off, e.g. 25000)'
        default: '0'
      cpu_idle_teo:
        description: 'CPU idle: TEO governor (pkenti)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      pkenti_config:
        description: 'pkenti defconfig changes (BBR, fq_codel, HZ 300, debug off, ...)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      release:
        description: 'Publish Image and dtb.img as plain files in a GitHub Release'
        type: choice
        options: ['true', 'false']
        default: 'true'
      ksu_repo:
        description: 'KernelSU repository (owner/name)'
        default: 'backslashxx/KernelSU'
      ksu_ref:
        description: 'KernelSU tag or commit, empty = latest on the default branch'
        default: ''
      defconfig:
        description: 'Kernel defconfig'
        default: 'exynos850-a13nsxx_defconfig'

permissions:
  contents: write

concurrency:
  group: build-aria-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  OUT: out
  KNAME: Aria
  ARIA_CI: ${{ github.workspace }}/ci
  CIP_GIT_URL: https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-24.0' }}
  CIP_MERGE: ${{ github.event.inputs.cip_merge || 'linux-4.19.y-st-rc' }}
  STRIP_CIP_LOCALVERSION: ${{ github.event.inputs.strip_cip_localversion || 'true' }}
  SELINUX: ${{ github.event.inputs.selinux || 'enforcing' }}
  KSU_HOOK: ${{ github.event.inputs.ksu_hook || 'branch_link' }}
  CPU_GOVERNOR: ${{ github.event.inputs.cpu_governor || 'schedutil' }}
  PHYSWIZZ_CONFIG: ${{ github.event.inputs.physwizz_config || 'true' }}
  RELEASE: ${{ github.event.inputs.release || 'true' }}
  FREQ_METHOD: ${{ github.event.inputs.freq_method || 'minimal' }}
  CPU_FREQ_MODE: ${{ github.event.inputs.cpu_freq_mode || 'stock' }}
  CPU_UV: ${{ github.event.inputs.cpu_undervolt_uv || '0' }}
  GPU_UV: ${{ github.event.inputs.gpu_undervolt_uv || '0' }}
  GPU_FREQ_MODE: ${{ github.event.inputs.gpu_freq_mode || 'stock' }}
  CPU_IDLE_TEO: ${{ github.event.inputs.cpu_idle_teo || 'true' }}
  PKENTI_CONFIG: ${{ github.event.inputs.pkenti_config || 'true' }}
  KSU_REPO: ${{ github.event.inputs.ksu_repo || 'backslashxx/KernelSU' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref }}
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}

jobs:
  build:
    name: Aria (${{ github.event.inputs.selinux || 'enforcing' }}, cip=${{ github.event.inputs.cip_merge || 'linux-4.19.y-st-rc' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: kernel

    steps:
      - name: Checkout Aria CI files (this repo)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Clone kernel tree
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "$CIP_MERGE" != "none" ]; then
            git clone --single-branch --branch "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel || {
              rm -rf kernel
              git clone "https://github.com/${KERNEL_REPO}.git" kernel
              git -C kernel checkout --force "${KERNEL_BRANCH}"
            }
          else
            git clone --depth=1 --branch "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel || {
              rm -rf kernel
              git clone "https://github.com/${KERNEL_REPO}.git" kernel
              git -C kernel checkout --force "${KERNEL_BRANCH}"
            }
          fi
          cd kernel
          git config user.name "Aria CI"
          git config user.email "actions@github.com"
          grep -q '^PATCHLEVEL = 19' Makefile || { echo "::error::not a 4.19 tree"; exit 1; }
          { echo "### Kernel tree"; echo "- \`${KERNEL_REPO}\` @ \`${KERNEL_BRANCH}\` ($(git rev-parse HEAD))"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge CIP branch (${{ github.event.inputs.cip_merge || 'linux-4.19.y-st-rc' }}) with Smart Exynos850 Resolution
        if: ${{ env.CIP_MERGE != 'none' }}
        run: |
          set -euo pipefail
          ORIG_HEAD="$(git rev-parse HEAD)"
          git remote add cip "$CIP_GIT_URL"
          git fetch --no-tags cip "+refs/heads/${CIP_MERGE}:refs/remotes/cip/${CIP_MERGE}"
          CIP_SHA="$(git rev-parse --short=12 "cip/${CIP_MERGE}")"
          CIP_LV="$(git show "cip/${CIP_MERGE}:localversion-st" 2>/dev/null || echo 'none')"

          MERGE_EXIT=0
          git merge --no-commit --no-ff "cip/${CIP_MERGE}" || MERGE_EXIT=$?
          if [ "$MERGE_EXIT" -ge 128 ]; then
            echo "::error::Fatal git merge error ($MERGE_EXIT)"
            exit "$MERGE_EXIT"
          fi

          if [ "$MERGE_EXIT" -ne 0 ]; then
            # 1. Resolve modify/delete (deleted non-Samsung DTS/tg3) and content conflicts (Exynos850/OneUI/5.10 backports)
            git diff --name-only --diff-filter=U > /tmp/cip-conflicted-files.txt
            while IFS= read -r cfile; do
              [ -n "$cfile" ] || continue
              if ! git cat-file -e "HEAD:${cfile}" 2>/dev/null; then
                git rm -f "$cfile"
              else
                git checkout --ours -- "$cfile"
                git add "$cfile"
              fi
            done < /tmp/cip-conflicted-files.txt

            # 2. Additive fixes required by clean-merged CIP files:
            #    (a) fs/Makefile: CIP commit bd82c675967d ("fs: common implementation of file type") adds fs_types.o
            if [ -f fs/fs_types.c ] && ! grep -q 'fs_types\.o' fs/Makefile; then
              sed -i 's/fs_context\.o fs_parser\.o/fs_context.o fs_parser.o fs_types.o/' fs/Makefile
              git add fs/Makefile
            fi

            #    (b) include/linux/fs.h: CIP commit bd82c675967d adds #include <linux/fs_types.h>
            if [ -f include/linux/fs_types.h ] && ! grep -q '<linux/fs_types\.h>' include/linux/fs.h; then
              sed -i '/#include <linux\/android_kabi\.h>/a #include <linux/fs_types.h>' include/linux/fs.h
              git add include/linux/fs.h
            fi

            #    (c) include/net/addrconf.h & net/ipv6/addrconf.c:
            #        - CIP commit d289479f070a adds in6_dev_hold_safe() used by net/ipv6/mcast.c
            #        - CIP commit babbfae4dda8 makes __ipv6_get_lladdr() static in net/ipv6/addrconf.c
            if ! grep -q 'in6_dev_hold_safe' include/net/addrconf.h; then
              sed -i '/void inet6_ifa_finish_destroy(struct inet6_ifaddr \*ifp);/i static inline bool in6_dev_hold_safe(struct inet6_dev *idev)\n{\n\treturn refcount_inc_not_zero(\&idev->refcnt);\n}\n' include/net/addrconf.h
            fi
            sed -i '/int __ipv6_get_lladdr(struct inet6_dev \*idev, struct in6_addr \*addr,/,/u32 banned_flags);/d' include/net/addrconf.h
            git add include/net/addrconf.h

            #    (d) net/socket.c & include/net/sock.h:
            #        - CIP commit 167aee6803e2 added sock_rmem_free() called in net/socket.c (anchor to `^static bool skb_is_err_queue` so call sites aren't matched)
            #        - CIP commit 0d8a35bed4aa added sk_owner in struct sock when CONFIG_PROVE_LOCKING && CONFIG_MODULES
            if [ -f net/socket.c ] && grep -q 'sock_rmem_free' net/socket.c && ! grep -q 'void sock_rmem_free' net/socket.c; then
              sed -i '/^static bool skb_is_err_queue/i extern void sock_rmem_free(struct sk_buff *skb);' net/socket.c
              git add net/socket.c
            fi
            if ! grep -q 'sk_owner' include/net/sock.h; then
              sed -i '/ANDROID_KABI_RESERVE(8);/a #if IS_ENABLED(CONFIG_PROVE_LOCKING) && IS_ENABLED(CONFIG_MODULES)\n\tstruct module\t\t*sk_owner;\n#endif' include/net/sock.h
              git add include/net/sock.h
            fi

            #    (e) drivers/md/dm-verity-debug.c:
            #        - CIP commit 0c8cbac25b40 ("dm-verity: make error counter atomic") changed v->corrupted_errs
            #          from unsigned int to atomic_t in dm-verity.h, breaking Samsung's out-of-tree dm-verity-debug.c
            if [ -f drivers/md/dm-verity-debug.c ] && grep -q 'atomic_t corrupted_errs' drivers/md/dm-verity.h; then
              sed -i 's/v->corrupted_errs++/atomic_inc(\&v->corrupted_errs)/g; s/v->corrupted_errs >=/atomic_read(\&v->corrupted_errs) >=/g; s/v->corrupted_errs ==/atomic_read(\&v->corrupted_errs) ==/g' drivers/md/dm-verity-debug.c
              git add drivers/md/dm-verity-debug.c
            fi

            #    (f) drivers/usb/core/hub.c:
            #        - CIP commit e11bcf49b050 uses USB_SS_PORT_U0_WAKE_TIME
            if ! grep -q 'USB_SS_PORT_U0_WAKE_TIME' drivers/usb/core/hub.c; then
              sed -i '/extern int deny_new_usb;/a #define USB_SS_PORT_U0_WAKE_TIME\t200  /* ms */' drivers/usb/core/hub.c
              git add drivers/usb/core/hub.c
            fi

            # 3. Keep Samsung OneUI fs/ext4, fs/f2fs, drivers/usb/dwc3, drivers/usb/host, and drivers/mmc coherent
            git checkout "$ORIG_HEAD" -- fs/ext4 fs/f2fs drivers/usb/dwc3 drivers/usb/host drivers/mmc include/linux/mmc
            git add fs/ext4 fs/f2fs drivers/usb/dwc3 drivers/usb/host drivers/mmc include/linux/mmc
          fi

          if [ "$STRIP_CIP_LOCALVERSION" = "true" ]; then
            rm -f localversion-st localversion-cip .gitlab-ci.yml
            git rm --ignore-unmatch -f localversion-st localversion-cip .gitlab-ci.yml >/dev/null 2>&1 || true
          fi

          git commit -m "Merge cip/${CIP_MERGE} (${CIP_SHA}, ${CIP_LV}) into ${KERNEL_BRANCH}"
          {
            echo "### CIP Merge"
            echo "- Merged \`cip/${CIP_MERGE}\` @ \`${CIP_SHA}\` (\`localversion-st: ${CIP_LV}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            lz4 zstd cpio rsync xz-utils zip unzip curl git python3

      - name: Set up Neutron Clang
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -fsSLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/neutron-clang/bin/clang" --version | head -1

      - name: Add KernelSU (official setup.sh)
        id: ksu
        run: |
          set -euo pipefail
          rm -rf KernelSU
          git clone "https://github.com/${KSU_REPO}.git" KernelSU
          REF="${KSU_REF:-$(git -C KernelSU symbolic-ref --short HEAD)}"
          bash KernelSU/kernel/setup.sh "$REF"

          test -L drivers/kernelsu && test -f drivers/kernelsu/Kconfig
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo "short=$(git -C KernelSU rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### KernelSU"
            echo "- \`${KSU_REPO}\` @ \`${REF}\` ($(git -C KernelSU rev-parse HEAD))"
            echo "- hook method: \`${KSU_HOOK}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KernelSU in the defconfig
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          test -f "$D"
          sed -i '/^CONFIG_KSU/d;/^# CONFIG_KSU/d' "$D"
          {
            echo ''
            echo '# KernelSU (backslashxx)'
            echo 'CONFIG_KSU=y'
            if [ "$KSU_HOOK" = "syscall_table" ]; then
              echo 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y'
            else
              echo 'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y'
            fi
          } >> "$D"
          sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-${KNAME}\"/" "$D"
          grep -q '^CONFIG_KALLSYMS=y' "$D"
          grep -n 'CONFIG_KSU\|LOCALVERSION=' "$D"

      - name: Backport path_umount (KernelSU official guide, "Umount modules")
        run: |
          set -euo pipefail
          if grep -q 'int path_umount' fs/namespace.c; then
            echo "path_umount already present"
          else
            git apply --verbose "$ARIA_CI/.github/aria/path-umount.diff"
          fi

      - name: pkenti defconfig changes
        if: ${{ env.PKENTI_CONFIG == 'true' }}
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          grep -E '^(CONFIG_|# CONFIG_)' "$ARIA_CI/.github/aria/pkenti.config" > /tmp/pkenti.lines
          while IFS= read -r line; do
            opt="$(echo "$line" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/; s/^(CONFIG_[A-Za-z0-9_]+)=.*/\1/')"
            sed -i "/^${opt}=/d;/^# ${opt} is not set/d" "$D"
          done < /tmp/pkenti.lines
          { echo ''; echo '# pkenti'; cat /tmp/pkenti.lines; } >> "$D"
          wc -l /tmp/pkenti.lines

      - name: Keep traffic-control options on (NET_CLS_MATCHALL, NET_ACT_BPF)
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          sed -i '/^CONFIG_NET_CLS_MATCHALL=/d;/^# CONFIG_NET_CLS_MATCHALL is not set/d;/^CONFIG_NET_ACT_BPF=/d;/^# CONFIG_NET_ACT_BPF is not set/d' "$D"
          printf '\nCONFIG_NET_CLS_MATCHALL=y\nCONFIG_NET_ACT_BPF=y\n' >> "$D"

      - name: CPU governors (all built in, default ${{ github.event.inputs.cpu_governor || 'schedutil' }})
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          GOVS="PERFORMANCE POWERSAVE USERSPACE ONDEMAND CONSERVATIVE SCHEDUTIL ENERGYSTEP"
          for g in $GOVS; do
            sed -i "/^CONFIG_CPU_FREQ_GOV_${g}=/d;/^# CONFIG_CPU_FREQ_GOV_${g} is not set/d" "$D"
            sed -i "/^CONFIG_CPU_FREQ_DEFAULT_GOV_${g}=/d;/^# CONFIG_CPU_FREQ_DEFAULT_GOV_${g} is not set/d" "$D"
          done
          DEF="$(echo "$CPU_GOVERNOR" | tr a-z A-Z)"
          echo "$GOVS" | grep -qw "$DEF"
          {
            echo ''
            echo '# CPU governors'
            for g in $GOVS; do
              echo "CONFIG_CPU_FREQ_GOV_${g}=y"
              if [ "$g" = "$DEF" ]; then echo "CONFIG_CPU_FREQ_DEFAULT_GOV_${g}=y"
              else echo "# CONFIG_CPU_FREQ_DEFAULT_GOV_${g} is not set"; fi
            done
          } >> "$D"
          grep -n 'CPU_FREQ_GOV_\|CPU_FREQ_DEFAULT_GOV_' "$D"

      - name: physwizz defconfig changes
        if: ${{ env.PHYSWIZZ_CONFIG == 'true' }}
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          sed -i '/^CONFIG_CRYPTO_LZ4=/d;/^# CONFIG_CRYPTO_LZ4 is not set/d;/^CONFIG_CRYPTO_LZO=/d;/^# CONFIG_CRYPTO_LZO is not set/d' "$D"
          sed -i '/^CONFIG_KPROBES=/d;/^# CONFIG_KPROBES is not set/d;/^CONFIG_KPROBE_EVENTS=/d;/^# CONFIG_KPROBE_EVENTS is not set/d' "$D"
          sed -i '/^CONFIG_STACKPROTECTOR_STRONG=/d;/^# CONFIG_STACKPROTECTOR_STRONG is not set/d' "$D"
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d;/^# CONFIG_LOCALVERSION_AUTO is not set/d' "$D"
          {
            echo ''
            echo '# physwizz'
            echo 'CONFIG_CRYPTO_LZ4=y'
            echo '# CONFIG_KPROBES is not set'
            echo '# CONFIG_KPROBE_EVENTS is not set'
            echo '# CONFIG_STACKPROTECTOR_STRONG is not set'
            echo '# CONFIG_LOCALVERSION_AUTO is not set'
          } >> "$D"

      - name: Frequency modes (${{ github.event.inputs.freq_method || 'minimal' }}, cpu ${{ github.event.inputs.cpu_freq_mode || 'stock' }}, gpu ${{ github.event.inputs.gpu_freq_mode || 'stock' }})
        if: ${{ env.CPU_FREQ_MODE != 'stock' || env.GPU_FREQ_MODE != 'stock' }}
        run: |
          set -euo pipefail
          FULL=0; [ "$FREQ_METHOD" != "full" ] || FULL=1
          CMIN=0; CMAX=0; CSUS=0; GMIN=0; GMAX=0; GSUS=0
          case "$CPU_FREQ_MODE" in
            uc) CMIN=130000; CMAX=2002000 ;;
            oc) CMIN=130000; if [ "$FULL" = 1 ]; then CMAX=2314000; CSUS=1; else CMAX=2210000; fi ;;
          esac
          if [ "$GPU_FREQ_MODE" = "oc" ]; then GMAX=1196000; [ "$FULL" != 1 ] || { GMIN=100000; GSUS=1; }; fi
          cat > include/linux/aria_freq.h <<'EOF'
          #ifndef _LINUX_ARIA_FREQ_H
          #define _LINUX_ARIA_FREQ_H
          /* generated by the Aria workflow, kHz, 0 = off */
          #define ARIA_FULL        __FULL__
          #define ARIA_CPU_MIN_KHZ __CMIN__
          #define ARIA_CPU_MAX_KHZ __CMAX__
          #define ARIA_CPU_SUSTAIN __CSUS__
          #define ARIA_GPU_MIN_KHZ __GMIN__
          #define ARIA_GPU_MAX_KHZ __GMAX__
          #endif
          EOF
          sed -i "s/__FULL__/${FULL}/;s/__CMIN__/${CMIN}/;s/__CMAX__/${CMAX}/;s/__CSUS__/${CSUS}/;s/__GMIN__/${GMIN}/;s/__GMAX__/${GMAX}/" include/linux/aria_freq.h
          cat include/linux/aria_freq.h
          D="$ARIA_CI/.github/aria"
          git apply --verbose "$D/pkenti-core.diff"
          if [ "$FULL" = 1 ]; then
            [ "$CPU_FREQ_MODE" = "stock" ] || git apply --verbose "$D/pkenti-dts-cpu.diff"
            if [ "$GPU_FREQ_MODE" = "oc" ]; then
              git apply --verbose "$D/pkenti-dts-gpu.diff"
              git apply --verbose "$D/pkenti-gpu-pm.diff"
            fi
          else
            [ "$GPU_FREQ_MODE" != "oc" ] || git apply --verbose "$D/a12s-dts-gpu.diff"
          fi

      - name: CPU idle - TEO governor (pkenti)
        if: ${{ env.CPU_IDLE_TEO == 'true' }}
        run: |
          set -euo pipefail
          git apply --verbose "$ARIA_CI/.github/aria/pkenti-teo.diff"
          D="arch/arm64/configs/${DEFCONFIG}"
          sed -i '/^CONFIG_CPU_IDLE_GOV_TEO=/d;/^# CONFIG_CPU_IDLE_GOV_TEO is not set/d' "$D"
          echo 'CONFIG_CPU_IDLE_GOV_TEO=y' >> "$D"

      - name: SELinux mode (${{ github.event.inputs.selinux || 'enforcing' }})
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          sed -i '/^CONFIG_SECURITY_SELINUX_ALWAYS_\(PERMISSIVE\|ENFORCE\)/d;/^# CONFIG_SECURITY_SELINUX_ALWAYS_\(PERMISSIVE\|ENFORCE\)/d' "$D"
          if [ "$SELINUX" = "permissive" ]; then
            git apply --verbose "$ARIA_CI/.github/aria/selinux-always-permissive.diff"
            {
              echo 'CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y'
              echo '# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set'
            } >> "$D"
          else
            {
              echo '# CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE is not set'
              echo '# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set'
            } >> "$D"
          fi
          grep -n 'SELINUX_ALWAYS' "$D"

      - name: Kernel command line (SELinux + undervolt)
        run: |
          set -euo pipefail
          D="arch/arm64/configs/${DEFCONFIG}"
          for v in "$CPU_UV" "$GPU_UV"; do
            case "$v" in ''|*[!0-9]*) echo "::error::undervolt must be a whole number of microvolts, got '$v'"; exit 1;; esac
          done
          [ "$CPU_UV" -le 100000 ] && [ "$GPU_UV" -le 100000 ] || { echo "::error::undervolt above 100000 uV refused"; exit 1; }
          ARGS=""
          [ "$SELINUX" != "permissive" ] || ARGS="$ARGS androidboot.selinux=permissive"
          [ "$CPU_UV" = 0 ] || ARGS="$ARGS lit=-${CPU_UV} big=-${CPU_UV}"
          [ "$GPU_UV" = 0 ] || ARGS="$ARGS g3d=-${GPU_UV}"
          ARGS="${ARGS# }"
          sed -i '/^CONFIG_CMDLINE=/d' "$D"
          echo "CONFIG_CMDLINE=\"${ARGS}\"" >> "$D"
          grep -n '^CONFIG_CMDLINE' "$D"

      - name: Configure kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH="$ARCH" O="$OUT" LLVM=1 LLVM_IAS=1 KCFLAGS=-w CROSS_COMPILE=aarch64-linux-gnu- \
            PLATFORM_VERSION=14 ANDROID_MAJOR_VERSION=14 \
            KBUILD_BUILD_USER=aria KBUILD_BUILD_HOST=github "$DEFCONFIG"
          C="$OUT/.config"
          have() { grep -E "^(# )?$1( |=)" "$C" | head -n1 || true; }
          need() { grep -qxF "$1" "$C" || { echo "::error::missing in .config: $1   (has: $(have "$2"))"; exit 1; }; }
          want() { grep -qxF "$1" "$C" || echo "::warning::not applied: $1   (has: $(have "$2"))"; }
          unwant() { ! grep -qxF "$1" "$C" || echo "::warning::still set: $1"; }

          need 'CONFIG_KSU=y' CONFIG_KSU
          need "CONFIG_LOCALVERSION=\"-${KNAME}\"" CONFIG_LOCALVERSION
          if [ "$KSU_HOOK" = "syscall_table" ]; then
            need 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' CONFIG_KSU_TAMPER_SYSCALL_TABLE
          else
            need 'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' CONFIG_KSU_HACK_ARM64_BRANCH_LINK
          fi
          if [ "$SELINUX" = "permissive" ]; then
            need 'CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y' CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE
          else
            unwant 'CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y'
          fi
          DEF="$(echo "$CPU_GOVERNOR" | tr a-z A-Z)"
          for g in PERFORMANCE POWERSAVE USERSPACE ONDEMAND CONSERVATIVE SCHEDUTIL ENERGYSTEP; do
            need "CONFIG_CPU_FREQ_GOV_${g}=y" "CONFIG_CPU_FREQ_GOV_${g}"
          done
          need "CONFIG_CPU_FREQ_DEFAULT_GOV_${DEF}=y" "CONFIG_CPU_FREQ_DEFAULT_GOV_${DEF}"

          if [ "$PHYSWIZZ_CONFIG" = "true" ]; then
            want 'CONFIG_CRYPTO_LZ4=y' CONFIG_CRYPTO_LZ4
            unwant 'CONFIG_KPROBES=y'
            unwant 'CONFIG_STACKPROTECTOR_STRONG=y'
            unwant 'CONFIG_LOCALVERSION_AUTO=y'
          fi
          if [ "$PKENTI_CONFIG" = "true" ]; then
            want 'CONFIG_DEFAULT_TCP_CONG="bbr"' CONFIG_DEFAULT_TCP_CONG
            want 'CONFIG_HZ=300' CONFIG_HZ
          fi
          want 'CONFIG_CMDLINE_EXTEND=y' CONFIG_CMDLINE_EXTEND
          want 'CONFIG_NET_CLS_MATCHALL=y' CONFIG_NET_CLS_MATCHALL
          want 'CONFIG_NET_ACT_BPF=y' CONFIG_NET_ACT_BPF
          [ "$CPU_IDLE_TEO" != "true" ] || want 'CONFIG_CPU_IDLE_GOV_TEO=y' CONFIG_CPU_IDLE_GOV_TEO
          echo "config checks finished"

      - name: Build kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH="$ARCH" O="$OUT" LLVM=1 LLVM_IAS=1 KCFLAGS=-w CROSS_COMPILE=aarch64-linux-gnu- \
            PLATFORM_VERSION=14 ANDROID_MAJOR_VERSION=14 \
            KBUILD_BUILD_USER=aria KBUILD_BUILD_HOST=github Image dtbs

      - name: Make dtb.img
        run: |
          set -euo pipefail
          DTB="$(find "$OUT/arch/arm64/boot/dts" -name 'exynos3830.dtb' | head -n1)"
          test -n "$DTB" || { echo "::error::exynos3830.dtb was not built"; exit 1; }
          python3 "$ARIA_CI/.github/aria/mkdtbimg.py" "$DTB" "$OUT/arch/arm64/boot/dtb.img"
          ls -l "$OUT/arch/arm64/boot/Image" "$OUT/arch/arm64/boot/dtb.img"

      - name: Upload Image and dtb.img (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Aria-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtb.img
          if-no-files-found: error

      - name: Upload .config
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Aria-config
          path: kernel/out/.config
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Release plain Image and dtb.img
        if: ${{ env.RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria-${{ github.run_number }}
          name: Aria A135F #${{ github.run_number }} (${{ env.FREQ_METHOD }}, cpu ${{ env.CPU_FREQ_MODE }}, gpu ${{ env.GPU_FREQ_MODE }}, ${{ env.SELINUX }}, cip ${{ env.CIP_MERGE }})
          body: |
            Plain `Image` and `dtb.img` for the Galaxy A13 (SM-A135F). Flash both.
            - kernel: ${{ env.KERNEL_REPO }} @ ${{ env.KERNEL_BRANCH }}
            - CIP merge: ${{ env.CIP_MERGE }}
            - KernelSU: ${{ env.KSU_REPO }} (hook: ${{ env.KSU_HOOK }})
            - SELinux: ${{ env.SELINUX }}
            - frequency method: ${{ env.FREQ_METHOD }}, cpu: ${{ env.CPU_FREQ_MODE }}, gpu: ${{ env.GPU_FREQ_MODE }}
            - CPU governor default: ${{ env.CPU_GOVERNOR }}, TEO idle: ${{ env.CPU_IDLE_TEO }}
          files: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtb.img
          fail_on_unmatched_files: true
